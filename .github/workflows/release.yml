name: Manual CI Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        type: string
      release_name:
        description: Release name (optional)
        required: false
        type: string
      draft:
        description: Create as draft release
        required: false
        default: false
        type: boolean
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build PKHeXPlugin-PKHEdit.sln -c Release

      - name: Publish
        run: dotnet publish PKHeXPlugin-PKHEdit/PKHeXPlugin-PKHEdit.csproj -c Release -o publish

      - name: Package
        run: Compress-Archive -Path publish\* -DestinationPath PKHeXPlugin-PKHEdit.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKHeXPlugin-PKHEdit
          path: PKHeXPlugin-PKHEdit.zip

      - name: Create release
        # if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PKHeXPlugin-PKHEdit.zip
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
