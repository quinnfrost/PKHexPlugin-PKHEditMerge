name: Build and Release

on:
#   push:
#     tags:
#       - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build PKHeXPlugin-PKHEdit.sln -c Release

      - name: Publish
        run: dotnet publish PKHeXPlugin-PKHEdit/PKHeXPlugin-PKHEdit.csproj -c Release -o publish

      - name: Package
        run: Compress-Archive -Path publish\* -DestinationPath PKHeXPlugin-PKHEdit.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKHeXPlugin-PKHEdit
          path: PKHeXPlugin-PKHEdit.zip

      - name: Create release
        # if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PKHeXPlugin-PKHEdit.zip
          generate_release_notes: true
